name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: facility4hire
      DB_USERNAME: facility4hire
      DB_PASSWORD: password

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: facility4hire
          MYSQL_USER: facility4hire
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create testing database
        run: >-
          mysql --host=127.0.0.1 --user=root --password=password
          --execute="CREATE DATABASE IF NOT EXISTS testing;
          GRANT ALL PRIVILEGES ON testing.* TO 'facility4hire'@'%';"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
